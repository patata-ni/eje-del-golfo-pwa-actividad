name: Generar memoria tecnica PDF
on:
  push:
    branches: [reporte-pdf-pwa]
    paths: ['scripts/build-reporte-pwa.py', '.github/workflows/reporte-pdf.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recuperar evidencia verificada
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 46062408170 --name evidencias-reporte-pwa --dir insumos
      - run: python -m pip install reportlab pymupdf Pillow
      - name: Componer y verificar reporte PDF
        run: python scripts/build-reporte-pwa.py
      - uses: actions/upload-artifact@v4
        with:
          name: Reporte_Tecnico_PWA_Eje_del_Golfo
          path: reporte-final
      - name: Conservar entregable y vistas de revision
        run: |
          git config user.name "Tania Gonzalez"
          git config user.email "103388737+patata-ni@users.noreply.github.com"
          git add reporte-final
          git commit -m "docs(pwa): conservar reporte PDF y evidencia de revision"
          git push origin HEAD:reporte-pdf-pwa
