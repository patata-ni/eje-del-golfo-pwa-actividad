name: Grabar demostracion funcional PWA
on:
  push:
    branches: [evidencia-video-pwa]
    paths: ['scripts/grabar-demo-pwa.mjs', 'scripts/convertir-demo.py', '.github/workflows/video-demo.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install chromium
      - run: python -m pip install imageio-ffmpeg Pillow
      - name: Grabar operaciones reales contra el sitio publicado
        run: node scripts/grabar-demo-pwa.mjs
      - name: Convertir y verificar video MP4
        run: python scripts/convertir-demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: Video_Funcionalidad_PWA_Eje_del_Golfo
          path: video-final
      - name: Conservar evidencia y revision
        run: |
          git config user.name "Tania Gonzalez"
          git config user.email "103388737+patata-ni@users.noreply.github.com"
          git add video-final
          git commit -m "docs(pwa): conservar grabacion funcional y comprobaciones"
          git push origin HEAD:evidencia-video-pwa
